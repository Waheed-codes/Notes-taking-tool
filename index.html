<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebooks Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      
      <div class="sidebar">
        <div class="sidebar-header">
          <h1>Notebooks</h1>
        </div>
        <button id="addnotebook">+ New Notebook</button>
        <hr class="linebreak" />
        <div id="subbook" class="notebook-tree"></div>
      </div>

      <div class="main">
        
        <div id="empty-state" class="empty-state">
          <h2>No Notebook Selected</h2>
          <p>Create a new notebook or select one from the sidebar to begin.</p>
        </div>

        <div id="workspace" class="workspace">
          <div class="workspace-header">
            <input
              type="text"
              id="notebook-title-input"
              class="notebook-title-input"
              value=""
              placeholder="Notebook Name"
            />
            <div class="tabs-nav">
              <button class="tab-btn active" data-tab="notes">Notes</button>
              <button class="tab-btn" data-tab="canvas">Canvas</button>
              <button class="tab-btn" data-tab="tasks">Tasks</button>
            </div>
          </div>

          <div class="workspace-content">
            
            <div id="tab-notes" class="tab-panel active">
              <textarea
                id="notes-textarea"
                placeholder="Start typing your notes here..."
              ></textarea>
            </div>

            <div id="tab-canvas" class="tab-panel">
              <div class="canvas-toolbar">
                <div class="tool-group">
                  <button class="tool-btn active" data-tool="pen" title="Freehand pen">✎ Pen</button>
                  <button class="tool-btn" data-tool="eraser" title="Eraser">▢ Eraser</button>
                  <button class="tool-btn" data-tool="auto" title="Draw freehand, snaps to the closest shape">✨ Auto</button>
                  <button class="tool-btn" data-tool="line" title="Straight line">╱ Line</button>
                  <button class="tool-btn" data-tool="rectangle" title="Rectangle">▭ Rect</button>
                  <button class="tool-btn" data-tool="circle" title="Circle / Ellipse">◯ Circle</button>
                </div>
                <label class="canvas-tool">
                  <span>Color</span>
                  <input type="color" id="canvas-color" value="#1c1917" />
                </label>
                <label class="canvas-tool">
                  <span>Size</span>
                  <input type="range" id="canvas-size" min="1" max="24" value="3" />
                </label>
                <button id="canvas-clear" class="ghost-btn">Clear</button>
              </div>
              <div class="canvas-wrap">
                <canvas id="draw-canvas" width="1000" height="620"></canvas>
              </div>
            </div>

            <div id="tab-tasks" class="tab-panel">
              <div class="tasks-container">
                <div class="add-task-form">
                  <input
                    type="text"
                    id="new-task-input"
                    placeholder="Add a new task..."
                  />
                  <button id="add-task-btn">Add</button>
                </div>

                <div class="tasks-lists">
                  <div class="tasks-section">
                    <h4>Incomplete <span id="incomplete-count" class="task-count">0</span></h4>
                    <ul id="incomplete-tasks-list" class="tasks-list"></ul>
                  </div>

                  <div class="tasks-section">
                    <h4>Completed <span id="completed-count" class="task-count">0</span></h4>
                    <ul id="completed-tasks-list" class="tasks-list"></ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
